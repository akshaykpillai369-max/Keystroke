<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <style>
      @keyframes drawLine {
        from { stroke-dashoffset: 400; }
        to { stroke-dashoffset: 0; }
      }
      .line-a { stroke-dasharray: 400; stroke-dashoffset: 400; animation: drawLine 3s ease forwards; }
      .line-b { stroke-dasharray: 400; stroke-dashoffset: 400; animation: drawLine 3s ease 0.4s forwards; }
      .line-c { stroke-dasharray: 400; stroke-dashoffset: 400; animation: drawLine 3s ease 0.8s forwards; }
    </style>
  </defs>
  <g fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <polyline class="line-a" points="48 72 96 48 144 72"/>
    <polyline class="line-b" points="48 72 48 120 96 144"/>
    <polyline class="line-c" points="144 72 144 120 96 144"/>
    <line x1="96" y1="48" x2="96" y2="144" stroke-width="6" opacity="0.3"/>
  </g>
</svg>
